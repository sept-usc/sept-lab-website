<text x="225" y="115.0" font-size="17" fill="#656565" font-weight="400" text-anchor="middle">residual path</text>
<text x="610" y="115.0" font-size="17" fill="#656565" font-weight="400" text-anchor="middle">residual path</text>
<text x="28" y="295.0" font-size="21" fill="#252525" font-weight="400" text-anchor="start">x + 0 + 0 = x. The active inner-model layers are retained.</text>
