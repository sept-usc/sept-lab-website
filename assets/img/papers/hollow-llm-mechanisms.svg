<text x="812" y="575.0" font-size="20" fill="#656565" font-weight="400" text-anchor="middle">Same logits</text>
<text x="28" y="621.0" font-size="19" fill="#656565" font-weight="400" text-anchor="start">Coordinated weights, normalization, and positional encoding are required.</text>
