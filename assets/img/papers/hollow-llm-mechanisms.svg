<text x="567" y="519.0" font-size="23" fill="#252525" font-weight="400" text-anchor="middle">D′ = [D/2, D/2]</text>
<path d="M688 495L740 495" fill="none" stroke="#656565" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="752" y="458" width="120" height="74" rx="6" fill="#fcf6e8" stroke="#906000" stroke-width="1.5"/>
