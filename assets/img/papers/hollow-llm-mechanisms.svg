<text x="838" y="220.0" font-size="29" fill="#906000" font-weight="700" text-anchor="middle">x</text>
<rect x="142" y="165" width="176" height="90" rx="6" fill="#f6f6f6" stroke="#656565" stroke-width="1.5"/>
<text x="162" y="199.0" font-size="21" fill="#252525" font-weight="700" text-anchor="start">Attention</text>
<text x="162" y="230.0" font-size="20" fill="#252525" font-weight="400" text-anchor="start">output = 0</text>
<rect x="516" y="165" width="176" height="90" rx="6" fill="#f6f6f6" stroke="#656565" stroke-width="1.5"/>
<text x="536" y="199.0" font-size="21" fill="#252525" font-weight="700" text-anchor="start">FFN</text>
<text x="536" y="230.0" font-size="20" fill="#252525" font-weight="400" text-anchor="start">output = 0</text>
