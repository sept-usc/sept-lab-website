<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">Hollow-LLM serving and proving paths</title><desc id="desc">Before commitment, the model owner chooses structured ghost weights for a larger declared architecture. Serving executes a small inner model. Proof generation constructs the larger circuit witness for the same output. The verifier accepts a valid proof of the committed relation, which does not measure actual serving effort.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#656565"/></marker></defs>
<rect width="900" height="650" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="34.0" font-size="25" fill="#252525" font-weight="700" text-anchor="start">Hollow-LLM: a larger declaration, a smaller serving path</text>
<rect x="28" y="70" width="844" height="112" rx="6" fill="#f6f6f6" stroke="#656565" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="48" y="106.0" font-size="24" fill="#252525" font-weight="700" text-anchor="start">Choose structured private weights, then commit</text>
<text x="48" y="143.0" font-size="22" fill="#252525" font-weight="400" text-anchor="start">Small inner model + identity layers or replicated coordinates</text>
<path d="M208 187L208 247" fill="none" stroke="#656565" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M692 187L692 247" fill="none" stroke="#656565" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="230" y="226.0" font-size="17" fill="#656565" font-weight="700" text-anchor="start">SERVE</text>
<text x="711" y="226.0" font-size="17" fill="#656565" font-weight="700" text-anchor="start">PROVE</text>
<rect x="28" y="262" width="360" height="142" rx="6" fill="#fcf6e8" stroke="#906000" stroke-width="1.5"/>
<text x="48" y="298.0" font-size="22" fill="#906000" font-weight="700" text-anchor="start">Execute the small inner model</text>
<text x="48" y="334" font-size="20" fill="#252525" font-weight="400" text-anchor="start">Identity / replica work collapses</text>
<text x="48" y="363" font-size="20" fill="#252525" font-weight="400" text-anchor="start">on the online serving path.</text>
<rect x="512" y="262" width="360" height="142" rx="6" fill="#f6f6f6" stroke="#656565" stroke-width="1.5"/>
<text x="532" y="298.0" font-size="22" fill="#252525" font-weight="700" text-anchor="start">Use the larger declared circuit</text>
<text x="532" y="334" font-size="20" fill="#252525" font-weight="400" text-anchor="start">Construct its witness</text>
<text x="532" y="363" font-size="20" fill="#252525" font-weight="400" text-anchor="start">and generate a valid proof.</text>
<path d="M208 409L208 448" fill="none" stroke="#656565" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M692 409L692 448" fill="none" stroke="#656565" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="28" y="462" width="360" height="112" rx="6" fill="#fcf6e8" stroke="#906000" stroke-width="1.5"/>
<text x="48" y="499.0" font-size="23" fill="#906000" font-weight="700" text-anchor="start">Same logits and output y</text>
<text x="48" y="538.0" font-size="21" fill="#252525" font-weight="400" text-anchor="start">as the inner model</text>
<rect x="512" y="462" width="360" height="112" rx="6" fill="#edf7ee" stroke="#000000" stroke-width="1.5"/>
<path d="M533 492l5 5 10-12" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="559" y="499.0" font-size="23" fill="#000000" font-weight="700" text-anchor="start">Verifier accepts</text>
<text x="532" y="538.0" font-size="20" fill="#252525" font-weight="400" text-anchor="start">Committed relation is satisfied.</text>
<path d="M394 520L502 520" fill="none" stroke="#656565" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="448" y="503.0" font-size="17" fill="#656565" font-weight="400" text-anchor="middle">same y</text>
<text x="28" y="618.0" font-size="20" fill="#656565" font-weight="400" text-anchor="start">A valid inference proof does not measure the effort spent serving the response.</text>
</g></svg>
