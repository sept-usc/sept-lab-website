<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">ARGUS inference verification pipeline</title><desc id="desc">An untrusted GPU performs LLM inference and exports intermediate values through untrusted shared buffers. ARGUS copies each frame into protected CPU CVM memory, checks arithmetic, cross-layer consistency, and token selection, then releases a response and signed receipt only after verification passes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#656565"/></marker></defs>
<rect width="900" height="650" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="34.0" font-size="25" fill="#252525" font-weight="700" text-anchor="start">ARGUS: verify execution before releasing a response</text>
<text x="28" y="84.0" font-size="17" fill="#656565" font-weight="700" text-anchor="start">OUTSIDE THE TRUST BOUNDARY</text>
<rect x="28" y="104" width="220" height="302" rx="6" fill="#f6f6f6" stroke="#656565" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="48" y="143" font-size="24" fill="#252525" font-weight="700" text-anchor="start">Untrusted</text>
<text x="48" y="174" font-size="24" fill="#252525" font-weight="700" text-anchor="start">GPU</text>
<rect x="48" y="200" width="16" height="14" rx="1" fill="white" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="72" y="200" width="16" height="14" rx="1" fill="#e8e8e8" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="96" y="200" width="16" height="14" rx="1" fill="white" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="120" y="200" width="16" height="14" rx="1" fill="#e8e8e8" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="144" y="200" width="16" height="14" rx="1" fill="white" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="48" y="222" width="16" height="14" rx="1" fill="#e8e8e8" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="72" y="222" width="16" height="14" rx="1" fill="white" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="96" y="222" width="16" height="14" rx="1" fill="#e8e8e8" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="120" y="222" width="16" height="14" rx="1" fill="white" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="144" y="222" width="16" height="14" rx="1" fill="#e8e8e8" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="48" y="244" width="16" height="14" rx="1" fill="white" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="72" y="244" width="16" height="14" rx="1" fill="#e8e8e8" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="96" y="244" width="16" height="14" rx="1" fill="white" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="120" y="244" width="16" height="14" rx="1" fill="#e8e8e8" stroke="#d7d7d7" stroke-width="1.5"/>
<rect x="144" y="244" width="16" height="14" rx="1" fill="white" stroke="#d7d7d7" stroke-width="1.5"/>
<text x="48" y="302" font-size="21" fill="#252525" font-weight="400" text-anchor="start">Full LLM</text>
<text x="48" y="331" font-size="21" fill="#252525" font-weight="400" text-anchor="start">forward pass</text>
<text x="48" y="380.0" font-size="17" fill="#656565" font-weight="400" text-anchor="start">Export intermediates</text>
<path d="M254 266L291 266" fill="none" stroke="#656565" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="300" y="177" width="168" height="177" rx="6" fill="#f6f6f6" stroke="#656565" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="318" y="214" font-size="22" fill="#252525" font-weight="700" text-anchor="start">Shared</text>
<text x="318" y="243" font-size="22" fill="#252525" font-weight="700" text-anchor="start">buffers</text>
<text x="318" y="285" font-size="18" fill="#656565" font-weight="400" text-anchor="start">Untrusted</text>
<text x="318" y="312" font-size="18" fill="#656565" font-weight="400" text-anchor="start">transfer path</text>
<path d="M474 266L510 266" fill="none" stroke="#656565" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="520" y="104" width="352" height="302" rx="6" fill="#fcf6f5" stroke="#990000" stroke-width="1.5"/>
<text x="540" y="143.0" font-size="24" fill="#990000" font-weight="700" text-anchor="start">Trusted CPU CVM</text>
<text x="540" y="178.0" font-size="19" fill="#252525" font-weight="400" text-anchor="start">Copy once into protected memory</text>
<path d="M540 199L852 199" fill="none" stroke="#d7d7d7" stroke-width="1.7"/>
<path d="M541 229l5 5 10-12" fill="none" stroke="#990000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="566" y="237.0" font-size="20" fill="#252525" font-weight="400" text-anchor="start">Matrix-product checks</text>
<path d="M541 270l5 5 10-12" fill="none" stroke="#990000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="566" y="278.0" font-size="20" fill="#252525" font-weight="400" text-anchor="start">Nonlinear + layer checks</text>
<path d="M541 311l5 5 10-12" fill="none" stroke="#990000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="566" y="319.0" font-size="20" fill="#252525" font-weight="400" text-anchor="start">Token-selection checks</text>
<text x="540" y="380.0" font-size="18" fill="#656565" font-weight="400" text-anchor="start">Secret randomness stays inside</text>
<path d="M696 411L696 465" fill="none" stroke="#656565" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="712" y="445.0" font-size="18" fill="#990000" font-weight="700" text-anchor="start">Checks pass</text>
<rect x="520" y="480" width="352" height="126" rx="6" fill="#fcf6e8" stroke="#906000" stroke-width="1.5"/>
<text x="540" y="516.0" font-size="22" fill="#906000" font-weight="700" text-anchor="start">Response + signed receipt</text>
<text x="540" y="551" font-size="20" fill="#252525" font-weight="400" text-anchor="start">Release after the complete</text>
<text x="540" y="580" font-size="20" fill="#252525" font-weight="400" text-anchor="start">response has been verified.</text>
<text x="28" y="496.0" font-size="22" fill="#252525" font-weight="700" text-anchor="start">The receipt binds</text>
<text x="28" y="531" font-size="21" fill="#252525" font-weight="400" text-anchor="start">Request · response · model</text>
<text x="28" y="563" font-size="21" fill="#252525" font-weight="400" text-anchor="start">Runtime · verification policy</text>
<text x="28" y="603.0" font-size="18" fill="#990000" font-weight="400" text-anchor="start">Failed checks reject the request.</text>
</g></svg>
