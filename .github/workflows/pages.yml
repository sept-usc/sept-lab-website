# Build the site from data/*.json, check it, and publish dist/ to GitHub Pages.
# Pull requests are built and checked but not deployed.
# Publishing is enabled when the repository variable PAGES_ENABLED is "true".
# One-time setup to publish: set Pages > Build and deployment > Source to "GitHub Actions", then add
# the variable under Settings > Secrets and variables > Actions > Variables: PAGES_ENABLED = true.
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    # 3.9 is the oldest Python the README promises (macOS ships it as /usr/bin/python3).
    # Pinned to ubuntu-24.04 because setup-python offers no 3.9 build for newer images.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the site
        run: python build.py

      - name: Test generated search metadata and text exports
        run: python -m unittest discover -s tests -v

      - name: Check links and ids
        run: python tools/check_links.py

  build:
    needs: check
    if: vars.PAGES_ENABLED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write  # configure-pages reads the repository's Pages settings
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the site
        run: python build.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-search:
    name: Notify search engines of changed pages
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Search service failures are visible here without failing an already published site.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rebuild the deployed pages for change detection
        run: python build.py

      - name: Restore the last accepted IndexNow state
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .indexnow-state.json
          key: indexnow-v1-${{ hashFiles('indexnow.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-v1-${{ hashFiles('indexnow.json') }}-

      - name: Submit changed and removed canonical pages
        id: notify
        run: >-
          python tools/indexnow.py --site-dir dist --config indexnow.json
          --state .indexnow-state.json --key-attempts 12 --key-delay 10
          2>&1 | tee "$RUNNER_TEMP/indexnow.txt"

      - name: Remember the accepted submission
        if: always() && hashFiles('.indexnow-state.json') != ''
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .indexnow-state.json
          key: indexnow-v1-${{ hashFiles('indexnow.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report the notification result
        if: always()
        env:
          NOTIFY_OUTCOME: ${{ steps.notify.outcome }}
        run: |
          {
            echo "### IndexNow"
            echo
            if [ -f "$RUNNER_TEMP/indexnow.txt" ]; then
              echo '```text'
              cat "$RUNNER_TEMP/indexnow.txt"
              echo '```'
            fi
            echo
            echo 'Receipt does not establish crawling, indexing or an AI citation. This does not submit directly to Google or OpenAI.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$NOTIFY_OUTCOME" != success ]; then
            echo '::warning::IndexNow notification did not complete. The site is deployed; inspect this job and retry. Unreceived URLs retain their previous state.'
          fi
