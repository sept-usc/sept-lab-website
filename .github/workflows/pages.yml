# Build the site from data/*.json, check it, and publish dist/ to GitHub Pages.
# Pull requests are built and checked but not deployed.
# Publishing is enabled when the repository variable PAGES_ENABLED is "true".
# One-time setup to publish: set Pages > Build and deployment > Source to "GitHub Actions", then add
# the variable under Settings > Secrets and variables > Actions > Variables: PAGES_ENABLED = true.
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    # 3.9 is the oldest Python the README promises (macOS ships it as /usr/bin/python3).
    # Pinned to ubuntu-24.04 because setup-python offers no 3.9 build for newer images.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the site
        run: python build.py

      - name: Test generated search metadata and text exports
        run: python -m unittest discover -s tests -v

      - name: Check links and ids
        run: python tools/check_links.py

  build:
    needs: check
    if: vars.PAGES_ENABLED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write  # configure-pages reads the repository's Pages settings
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the site
        run: python build.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
